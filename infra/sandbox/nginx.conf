events {}

http {
  upstream codereferee_sandbox_pool {
    # Keep identical repository-validation payloads on the same worker so per-worker dependency caches are reused.
    hash $request_body consistent;
    server sandbox-1:8000;
    server sandbox-2:8000;
    server sandbox-3:8000;
  }

  server {
    listen 8100;

    location /health {
      proxy_pass http://codereferee_sandbox_pool/health;
    }

    location /repositories/validate {
      proxy_connect_timeout 5s;
      proxy_read_timeout 900s;
      proxy_send_timeout 900s;
      proxy_pass http://codereferee_sandbox_pool/repositories/validate;
    }
  }
}
