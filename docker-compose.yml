services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: codereferee
      POSTGRES_USER: codereferee
      POSTGRES_PASSWORD: codereferee
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  prometheus:
    image: prom/prometheus:v2.54.1
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  sandbox-1:
    build:
      context: ./infra/sandbox/service
    environment:
      SANDBOX_COMMAND_TIMEOUT_SECONDS: "600"
      SANDBOX_REPOSITORY_TIMEOUT_SECONDS: "300"
      SANDBOX_SERVER_START_TIMEOUT_SECONDS: "90"
      SANDBOX_MAX_LOG_CHARS: "16000"
      NPM_CONFIG_CACHE: /cache/npm
      YARN_CACHE_FOLDER: /cache/yarn
      PIP_CACHE_DIR: /cache/pip
      COMPOSER_CACHE_DIR: /cache/composer
      GRADLE_USER_HOME: /cache/gradle
      MAVEN_OPTS: -Dmaven.repo.local=/cache/maven/repository
    mem_limit: 1024m
    cpus: 1.0
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    volumes:
      - sandbox_1_cache:/cache

  sandbox-2:
    build:
      context: ./infra/sandbox/service
    environment:
      SANDBOX_COMMAND_TIMEOUT_SECONDS: "600"
      SANDBOX_REPOSITORY_TIMEOUT_SECONDS: "300"
      SANDBOX_SERVER_START_TIMEOUT_SECONDS: "90"
      SANDBOX_MAX_LOG_CHARS: "16000"
      NPM_CONFIG_CACHE: /cache/npm
      YARN_CACHE_FOLDER: /cache/yarn
      PIP_CACHE_DIR: /cache/pip
      COMPOSER_CACHE_DIR: /cache/composer
      GRADLE_USER_HOME: /cache/gradle
      MAVEN_OPTS: -Dmaven.repo.local=/cache/maven/repository
    mem_limit: 1024m
    cpus: 1.0
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    volumes:
      - sandbox_2_cache:/cache

  sandbox-3:
    build:
      context: ./infra/sandbox/service
    environment:
      SANDBOX_COMMAND_TIMEOUT_SECONDS: "600"
      SANDBOX_REPOSITORY_TIMEOUT_SECONDS: "300"
      SANDBOX_SERVER_START_TIMEOUT_SECONDS: "90"
      SANDBOX_MAX_LOG_CHARS: "16000"
      NPM_CONFIG_CACHE: /cache/npm
      YARN_CACHE_FOLDER: /cache/yarn
      PIP_CACHE_DIR: /cache/pip
      COMPOSER_CACHE_DIR: /cache/composer
      GRADLE_USER_HOME: /cache/gradle
      MAVEN_OPTS: -Dmaven.repo.local=/cache/maven/repository
    mem_limit: 1024m
    cpus: 1.0
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    volumes:
      - sandbox_3_cache:/cache

  sandbox-gateway:
    image: nginx:1.27-alpine
    depends_on:
      - sandbox-1
      - sandbox-2
      - sandbox-3
    ports:
      - "8100:8100"
    volumes:
      - ./infra/sandbox/nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  postgres_data:
  sandbox_1_cache:
  sandbox_2_cache:
  sandbox_3_cache:
