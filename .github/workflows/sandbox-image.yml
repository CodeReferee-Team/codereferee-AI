name: Sandbox image

# 통합 샌드박스 이미지(temurin 17 + maven + python3 + node20, 약 1.3GB)를 ECR로 올린다.
# AI Core가 레포를 clone/build/test할 때 이 이미지로 컨테이너를 띄운다.
#
# 거의 바뀌지 않으므로 Dockerfile이 변할 때만 돈다. 메인 CI를 느리게 만들지 않는다.
# 손으로 다시 굽고 싶으면 Actions 탭에서 Run workflow.
on:
  push:
    branches: [main]
    paths:
      - 'ai-core/sandbox/**'
      - '.github/workflows/sandbox-image.yml'
  workflow_dispatch:

concurrency:
  group: sandbox-image
  cancel-in-progress: false

jobs:
  build-push:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Check role ARN is configured
        env:
          ROLE: ${{ secrets.AWS_ROLE_ARN }}
        run: |
          [ -n "$ROLE" ] || {
            echo "::error::AWS_ROLE_ARN 시크릿이 없다. Settings > Secrets and variables > Actions 에서 추가한다."
            exit 1
          }

      - name: Assume AWS role via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: gha-${{ github.run_id }}
          aws-region: ap-northeast-2

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ai-core/sandbox
          push: true
          platforms: linux/amd64
          provenance: false
          # 태그 2는 app/config.py의 sandbox_image 기본값(codereferee/sandbox-multi:2)과
          # 맞춘 것이다. 인스턴스는 SANDBOX_IMAGE로 이 ECR 주소를 가리킨다.
          tags: |
            ${{ steps.ecr.outputs.registry }}/codereferee-sandbox-multi:2
            ${{ steps.ecr.outputs.registry }}/codereferee-sandbox-multi:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
